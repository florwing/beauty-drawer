kind = "web"
previewPath = "/"
title = "美妝庫存管理"
description = "一個手機優先的繁體中文個人美妝與護膚品庫存管理 App，支援相片、數量追蹤、快速扣減、補貨與本機儲存。"
version = "1.0.0"
id = "artifacts/beauty-inventory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18376

[services.development]
run = "pnpm --filter @workspace/beauty-inventory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beauty-inventory", "run", "build" ]
serve = "static"
publicDir = "artifacts/beauty-inventory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18376"
BASE_PATH = "/"
